<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FEEC02">
  <meta name="msapplication-navbutton-color" content="#FEEC02">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BOBR TESTIT — Выбор победителей</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');

    :root {
      --yellow: #FEEC02;
      --dark: #2A1A0A;
      --brown: #5C3A1E;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--yellow);
      color: var(--dark);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 10px 36px rgba(42, 26, 10, 0.16);
      overflow: hidden;
    }

    .header {
      background: var(--yellow);
      padding: 24px 16px 18px;
      text-align: center;
      border-bottom: 4px solid var(--dark);
    }

    .logo {
      width: 140px;
      max-width: 40vw;
      height: auto;
      margin-bottom: 6px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .title-dot {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1;
      margin: 4px 0 2px;
    }

    .subtitle {
      font-size: 12px;
      font-weight: 600;
      color: var(--brown);
      margin-top: 4px;
      letter-spacing: 1.5px;
    }

    .content {
      padding: 20px 16px 28px;
    }

    label {
 display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--dark);
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 14px;
      border: 3px solid var(--dark);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      resize: vertical;
      background: #FFFDF5;
      margin-bottom: 12px;
      -webkit-appearance: none;
    }

    .file-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .file-btn {
      flex: 1;
      padding: 12px;
      background: #FFFDF5;
      border: 3px dashed var(--dark);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      color: var(--dark);
      transition: background 0.15s;
    }

    .file-btn:active {
      background: var(--yellow);
    }

    #fileInput {
      display: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .controls label {
      margin-bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    input[type="number"] {
      width: 72px;
      padding: 10px;
      border: 3px solid var(--dark);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      background: #FFFDF5;
      -webkit-appearance: none;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--dark);
      color: var(--yellow);
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      margin-bottom: 10px;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.98);
      background: #3d2a15;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--dark);
      border: 3px solid var(--dark);
    }

    .btn-secondary:active {
      background: var(--yellow);
    }

    .btn-copy {
      background: #1a7a3a;
      color: white;
      display: none;
    }

    .btn-copy:active {
      background: #14632e;
    }

    .stats {
      font-size: 13px;
      color: var(--brown);
      text-align: center;
      margin-bottom: 14px;
    }

    /* SLOT ANIMATION */
    .slot-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(42, 26, 10, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .slot-overlay.active {
      display: flex;
    }

    .slot-machine {
      background: var(--yellow);
      border: 5px solid var(--dark);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 0 0 6px rgba(254, 236, 2, 0.3);
    }

    .slot-title {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .slot-window {
      background: var(--dark);
      border-radius: 12px;
      height: 64px;
      overflow: hidden;
      position: relative;
      margin-bottom: 8px;
      border: 3px solid #5C3A1E;
    }

    .slot-reel {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
    }

    .slot-item {
      height: 64px;
      line-height: 64px;
      font-size: 20px;
      font-weight: 800;
      color: var(--yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 12px;
    }

    .slot-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
      margin-top: 12px;
      min-height: 20px;
    }

    .winners-box {
      display: none;
      margin-top: 18px;
      padding: 18px 14px;
      background: var(--yellow);
      border-radius: 16px;
      border: 3px solid var(--dark);
      text-align: center;
    }

    .winners-box h2 {
      font-size: 16px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .winner-item {
      background: var(--white);
      margin: 8px 0;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      animation: popIn 0.4s ease forwards;
      opacity: 0;
      transform: scale(0.85);
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .winner-item:active {
      background: #fff8d0;
      transform: scale(0.97);
    }

    .winner-item .place {
      color: var(--brown);
      font-size: 14px;
      margin-right: 6px;
    }

    .winner-item .hint {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      margin-top: 4px;
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--brown);
      line-height: 1.5;
    }

    .footer a {
      color: var(--dark);
      font-weight: 700;
      text-decoration: none;
    }

    @media (min-width: 600px) {
      body { padding: 24px; }
      .container { border-radius: 24px; }
      .logo { width: 160px; }
      .content { padding: 24px 22px 32px; }
    }
  
    /* Progress bar */
    .progress-wrap {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      background: #FFFDF5;
      border: 3px solid var(--dark);
      border-radius: 14px;
    }
    .progress-wrap.active {
      display: block;
    }
    .progress-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
      color: var(--dark);
    }
    .progress-track {
      height: 22px;
      background: #e8e0c0;
      border-radius: 11px;
      overflow: hidden;
      border: 2px solid var(--dark);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 9px;
      background: repeating-linear-gradient(
        -45deg,
        var(--dark),
        var(--dark) 12px,
        var(--yellow) 12px,
        var(--yellow) 24px
      );
      background-size: 34px 34px;
      animation: progressStripes 0.6s linear infinite;
      transition: width 0.35s ease-out;
    }
    
    .slot-skip {
      margin-top: 18px;
      padding: 12px 28px;
      background: transparent;
      border: 2px solid rgba(254, 236, 2, 0.5);
      border-radius: 12px;
      color: var(--yellow);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .slot-skip:active {
      background: rgba(254, 236, 2, 0.15);
    }


    .congrats {
      display: none;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 12px;
      animation: congratsPop 0.5s ease;
    }
    .congrats.show {
      display: block;
    }
    @keyframes congratsPop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 200;
      pointer-events: none;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    @keyframes progressStripes {
      from { background-position: 0 0; }
      to { background-position: 34px 0; }
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.jpg" alt="BOBR TESTIT" class="logo" onerror="this.style.display='none'">
      <div class="title-dot">•</div>
      <div class="subtitle">РОЗЫГРЫШ</div>
    </div>

    <div class="content">
      <label for="names">Список участников</label>
      <textarea id="names" placeholder="@user1&#10;@user2&#10;@user3&#10;..."></textarea>

      <div class="file-row">
        <label class="file-btn" for="fileInput">📂 Загрузить .txt файл</label>
        <input type="file" id="fileInput" accept=".txt,.csv,text/plain">
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label" id="progressLabel">Читаем файл...</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="controls">
        <label>
          Победителей:
          <input type="number" id="count" value="" min="1" max="50" placeholder="—">
        </label>
      </div>

      <div class="stats" id="stats">Участников: 0 (уникальных: 0)</div>

      <button class="btn" id="pickBtn" onclick="startDraw()">🎲 Выбрать победителей</button>
      <button class="btn btn-secondary" onclick="clearAll()">Очистить</button>
      <button class="btn btn-copy" id="copyBtn" onclick="copyResult()">📋 Скопировать результат</button>

      <div class="winners-box" id="winnersBox">
        <div class="congrats" id="congratsText">🎉 Поздравляем!</div>
        <h2>🏆 Победители</h2>
        <div id="winnersList"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    BOBR TESTIT • Bobruisk<br>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Наш Instagram</a>
  </div>

  <div class="slot-overlay" id="slotOverlay">
    <div class="slot-machine">
      <div class="slot-title">BOBR TESTIT</div>
      <div class="slot-window">
        <div class="slot-reel" id="slotReel"></div>
      </div>
      <div class="slot-status" id="slotStatus">Крутим...</div>
    </div>
    <button class="slot-skip" id="slotSkip" onclick="skipAnimation()">Пропустить ▶</button>
  </div>

  <script>
    const textarea = document.getElementById('names');
    const stats = document.getElementById('stats');
    const winnersBox = document.getElementById('winnersBox');
    const winnersList = document.getElementById('winnersList');
    const countInput = document.getElementById('count');
    const pickBtn = document.getElementById('pickBtn');
    const copyBtn = document.getElementById('copyBtn');
    const fileInput = document.getElementById('fileInput');
    const slotOverlay = document.getElementById('slotOverlay');
    const slotReel = document.getElementById('slotReel');
    const slotStatus = document.getElementById('slotStatus');

    let lastWinners = [];

    textarea.addEventListener('input', updateStats);
    fileInput.addEventListener('change', handleFile);

    function getUniqueNames() {
      const raw = textarea.value
        .split(/[\n,;]+/)
        .map(s => s.trim().replace(/^@/, ''))
        .filter(s => s.length > 0);

      const seen = new Set();
      const unique = [];
      for (const name of raw) {
        const lower = name.toLowerCase();
        if (!seen.has(lower)) {
          seen.add(lower);
          unique.push(name);
        }
      }
      return unique;
    }

    function updateStats() {
      const raw = textarea.value
        .split(/[\n,;]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
      const unique = getUniqueNames();
      stats.textContent = 'Участников: ' + raw.length + ' (уникальных: ' + unique.length + ')';
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const progressWrap = document.getElementById('progressWrap');
      const progressFill = document.getElementById('progressFill');
      const progressLabel = document.getElementById('progressLabel');

      progressWrap.classList.add('active');
      progressFill.style.width = '0%';
      progressLabel.textContent = 'Читаем файл...';

      const reader = new FileReader();
      reader.onload = function(ev) {
        const text = ev.target.result;
        const steps = [
          { p: 18, t: 'Читаем файл...' },
          { p: 42, t: 'Загружаем участников...' },
          { p: 68, t: 'Проверяем список...' },
          { p: 88, t: 'Почти готово...' },
          { p: 100, t: 'Загружено!' }
        ];
        let step = 0;

        function tick() {
          if (step < steps.length) {
            progressFill.style.width = steps[step].p + '%';
            progressLabel.textContent = steps[step].t;
            step++;
            // ~5+ seconds total
            setTimeout(tick, 950 + Math.random() * 200);
          } else {
            setTimeout(function() {
              textarea.value = text;
              updateStats();
              progressWrap.classList.remove('active');
              progressFill.style.width = '0%';
            }, 600);
          }
        }
        tick();
      };
      reader.readAsText(file, 'UTF-8');
      fileInput.value = '';
    }

    function startDraw() {
      const unique = getUniqueNames();
      const count = parseInt(countInput.value, 10);
      if (!count || count < 1) {
        alert('Укажи количество победителей');
        countInput.focus();
        return;
      }

      if (unique.length === 0) {
        alert('Сначала вставь список участников или загрузи файл!');
        return;
      }
      if (count > unique.length) {
        alert('Уникальных участников только ' + unique.length + '. Нельзя выбрать больше.');
        return;
      }

      const shuffled = unique.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = t;
      }
      const winners = shuffled.slice(0, count);
      lastWinners = winners;

      runSlotAnimation(unique, winners);
    }

    let animSkipped = false;
    let animRunning = false;

    function skipAnimation() {
      animSkipped = true;
    }

    function runSlotAnimation(allNames, winners) {
      animSkipped = false;
      animRunning = true;
      pickBtn.disabled = true;
      slotOverlay.classList.add('active');

      let winnerIndex = 0;
      const revealed = [];

      function spinOne(done) {
        if (animSkipped) {
          done();
          return;
        }

        const currentWinner = winners[winnerIndex];
        slotStatus.textContent = 'Победитель ' + (winnerIndex + 1) + ' из ' + winners.length + '...';

        const reelNames = [];
        for (let i = 0; i < 28; i++) {
          reelNames.push(allNames[Math.floor(Math.random() * allNames.length)]);
        }
        reelNames.push(currentWinner);

        slotReel.innerHTML = reelNames.map(function(n) {
          return '<div class="slot-item">@' + n + '</div>';
        }).join('');
        slotReel.style.transform = 'translateY(0)';
        slotReel.style.transition = 'none';

        const itemH = 64;
        const stopAt = (reelNames.length - 1) * itemH;
        let pos = 0;
        let speed = 48;
        let phase = 'spin';

        function frame() {
          if (animSkipped) {
            done();
            return;
          }

          if (phase === 'spin') {
            pos += speed;
            if (pos > 900) phase = 'slow';
          } else if (phase === 'slow') {
            speed = Math.max(2.8, speed * 0.955);
            pos += speed;
            if (speed < 3.5 && pos >= stopAt - 15) {
              phase = 'stop';
              pos = stopAt;
            }
          }

          slotReel.style.transform = 'translateY(-' + pos + 'px)';

          if (phase === 'stop') {
            revealed.push(currentWinner);
            slotStatus.textContent = (winnerIndex + 1) + '. @' + currentWinner;
            setTimeout(function() {
              winnerIndex++;
              if (winnerIndex < winners.length && !animSkipped) {
                setTimeout(function() { spinOne(done); }, 450);
              } else {
                done();
              }
            }, 700);
            return;
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      spinOne(function() {
        animRunning = false;
        slotOverlay.classList.remove('active');
        showWinners(winners);
        pickBtn.disabled = false;
      });
    }

    function showWinners(winners) {
      winnersList.innerHTML = '';
      winnersBox.style.display = 'block';
      copyBtn.style.display = 'block';

      var congrats = document.getElementById('congratsText');
      if (congrats) {
        congrats.classList.remove('show');
        void congrats.offsetWidth;
        congrats.classList.add('show');
      }

      winners.forEach(function(name, index) {
        const a = document.createElement('a');
        a.className = 'winner-item';
        a.href = 'https://instagram.com/' + encodeURIComponent(name);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.animationDelay = (index * 0.12) + 's';
        a.innerHTML = '<span class="place">' + (index + 1) + '.</span>@' + name;
        winnersList.appendChild(a);
      });

      launchConfetti();
      winnersBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function launchConfetti() {
      var colors = ['#FEEC02', '#2A1A0A', '#5C3A1E', '#FFFFFF', '#FF6B00', '#E8C200'];
      var count = 80;
      for (var i = 0; i < count; i++) {
        (function(i) {
          setTimeout(function() {
            var el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left = (Math.random() * 100) + 'vw';
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            el.style.width = (6 + Math.random() * 10) + 'px';
            el.style.height = (6 + Math.random() * 10) + 'px';
            el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            el.style.animationDuration = (2.2 + Math.random() * 2) + 's';
            el.style.animationDelay = (Math.random() * 0.3) + 's';
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 4500);
          }, i * 18);
        })(i);
      }
    }

    function copyResult() {
      if (lastWinners.length === 0) return;
      const lines = lastWinners.map(function(n, i) {
        return (i + 1) + '. @' + n;
      });
      const text = '🏆 Победители розыгрыша BOBR TESTIT:\n\n' + lines.join('\n') + '\n\nПоздравляем! 🎉';

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          const original = copyBtn.textContent;
          copyBtn.textContent = '✓ Скопировано!';
          setTimeout(function() { copyBtn.textContent = original; }, 1800);
        });
      } else {
        prompt('Скопируйте текст:', text);
      }
    }

    function clearAll() {
      textarea.value = '';
      winnersBox.style.display = 'none';
      winnersList.innerHTML = '';
      copyBtn.style.display = 'none';
      lastWinners = [];
      var congrats = document.getElementById('congratsText');
      if (congrats) congrats.classList.remove('show');
      updateStats();
    }

    updateStats();
  </script>
</body>
</html>
