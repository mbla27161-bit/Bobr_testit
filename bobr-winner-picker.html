<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOBR TESTIT — Выбор победителей</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');

    :root {
      --yellow: #FEEC02;
      --dark: #2A1A0A;
      --brown: #5C3A1E;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--yellow);
      color: var(--dark);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 10px 36px rgba(42, 26, 10, 0.16);
      overflow: hidden;
    }

    .header {
      background: var(--yellow);
      padding: 24px 16px 18px;
      text-align: center;
      border-bottom: 4px solid var(--dark);
    }

    .logo {
      width: 140px;
      max-width: 40vw;
      height: auto;
      margin-bottom: 6px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .title {
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--dark);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 12px;
      font-weight: 600;
      color: var(--brown);
      margin-top: 4px;
      letter-spacing: 1.5px;
    }

    .content {
      padding: 20px 16px 28px;
    }

    label {
 display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--dark);
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 14px;
      border: 3px solid var(--dark);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      resize: vertical;
      background: #FFFDF5;
      margin-bottom: 12px;
      -webkit-appearance: none;
    }

    .file-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .file-btn {
      flex: 1;
      padding: 12px;
      background: #FFFDF5;
      border: 3px dashed var(--dark);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      color: var(--dark);
      transition: background 0.15s;
    }

    .file-btn:active {
      background: var(--yellow);
    }

    #fileInput {
      display: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .controls label {
      margin-bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    input[type="number"] {
      width: 72px;
      padding: 10px;
      border: 3px solid var(--dark);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      background: #FFFDF5;
      -webkit-appearance: none;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--dark);
      color: var(--yellow);
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      margin-bottom: 10px;
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.98);
      background: #3d2a15;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--dark);
      border: 3px solid var(--dark);
    }

    .btn-secondary:active {
      background: var(--yellow);
    }

    .btn-copy {
      background: #1a7a3a;
      color: white;
      display: none;
    }

    .btn-copy:active {
      background: #14632e;
    }

    .stats {
      font-size: 13px;
      color: var(--brown);
      text-align: center;
      margin-bottom: 14px;
    }

    /* SLOT ANIMATION */
    .slot-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(42, 26, 10, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .slot-overlay.active {
      display: flex;
    }

    .slot-machine {
      background: var(--yellow);
      border: 5px solid var(--dark);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 0 0 6px rgba(254, 236, 2, 0.3);
    }

    .slot-title {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .slot-window {
      background: var(--dark);
      border-radius: 12px;
      height: 64px;
      overflow: hidden;
      position: relative;
      margin-bottom: 8px;
      border: 3px solid #5C3A1E;
    }

    .slot-reel {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
    }

    .slot-item {
      height: 64px;
      line-height: 64px;
      font-size: 20px;
      font-weight: 800;
      color: var(--yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 12px;
    }

    .slot-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
      margin-top: 12px;
      min-height: 20px;
    }

    .winners-box {
      display: none;
      margin-top: 18px;
      padding: 18px 14px;
      background: var(--yellow);
      border-radius: 16px;
      border: 3px solid var(--dark);
      text-align: center;
    }

    .winners-box h2 {
      font-size: 16px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .winner-item {
      background: var(--white);
      margin: 8px 0;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      animation: popIn 0.4s ease forwards;
      opacity: 0;
      transform: scale(0.85);
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .winner-item:active {
      background: #fff8d0;
      transform: scale(0.97);
    }

    .winner-item .place {
      color: var(--brown);
      font-size: 14px;
      margin-right: 6px;
    }

    .winner-item .hint {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      margin-top: 4px;
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--brown);
      line-height: 1.5;
    }

    .footer a {
      color: var(--dark);
      font-weight: 700;
      text-decoration: none;
    }

    @media (min-width: 600px) {
      body { padding: 24px; }
      .container { border-radius: 24px; }
      .logo { width: 160px; }
      .content { padding: 24px 22px 32px; }
    }
  
    /* Progress bar */
    .progress-wrap {
      display: none;
      margin-bottom: 16px;
      padding: 14px;
      background: #FFFDF5;
      border: 3px solid var(--dark);
      border-radius: 14px;
    }
    .progress-wrap.active {
      display: block;
    }
    .progress-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
      color: var(--dark);
    }
    .progress-track {
      height: 18px;
      background: #e8e0c0;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--dark);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--dark), #5C3A1E);
      border-radius: 8px;
      transition: width 0.15s linear;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.jpg" alt="BOBR TESTIT" class="logo" onerror="this.style.display='none'">
      <div class="title">BOBR TESTIT</div>
      <div class="subtitle">BOBRUISK • РОЗЫГРЫШ</div>
    </div>

    <div class="content">
      <label for="names">Список участников</label>
      <textarea id="names" placeholder="@user1&#10;@user2&#10;@user3&#10;..."></textarea>

      <div class="file-row">
        <label class="file-btn" for="fileInput">📂 Загрузить .txt файл</label>
        <input type="file" id="fileInput" accept=".txt,.csv,text/plain">
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label" id="progressLabel">Читаем файл...</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="controls">
        <label>
          Победителей:
          <input type="number" id="count" value="5" min="1" max="50">
        </label>
      </div>

      <div class="stats" id="stats">Участников: 0 (уникальных: 0)</div>

      <button class="btn" id="pickBtn" onclick="startDraw()">🎲 Выбрать победителей</button>
      <button class="btn btn-secondary" onclick="clearAll()">Очистить</button>
      <button class="btn btn-copy" id="copyBtn" onclick="copyResult()">📋 Скопировать результат</button>

      <div class="winners-box" id="winnersBox">
        <h2>🏆 Победители</h2>
        <div id="winnersList"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    BOBR TESTIT • Bobruisk<br>
    <a href="https://instagram.com/" target="_blank" rel="noopener">Наш Instagram</a>
  </div>

  <div class="slot-overlay" id="slotOverlay">
    <div class="slot-machine">
      <div class="slot-title">BOBR TESTIT</div>
      <div class="slot-window">
        <div class="slot-reel" id="slotReel"></div>
      </div>
      <div class="slot-status" id="slotStatus">Крутим...</div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('names');
    const stats = document.getElementById('stats');
    const winnersBox = document.getElementById('winnersBox');
    const winnersList = document.getElementById('winnersList');
    const countInput = document.getElementById('count');
    const pickBtn = document.getElementById('pickBtn');
    const copyBtn = document.getElementById('copyBtn');
    const fileInput = document.getElementById('fileInput');
    const slotOverlay = document.getElementById('slotOverlay');
    const slotReel = document.getElementById('slotReel');
    const slotStatus = document.getElementById('slotStatus');

    let lastWinners = [];

    textarea.addEventListener('input', updateStats);
    fileInput.addEventListener('change', handleFile);

    function getUniqueNames() {
      const raw = textarea.value
        .split(/[\n,;]+/)
        .map(s => s.trim().replace(/^@/, ''))
        .filter(s => s.length > 0);

      const seen = new Set();
      const unique = [];
      for (const name of raw) {
        const lower = name.toLowerCase();
        if (!seen.has(lower)) {
          seen.add(lower);
          unique.push(name);
        }
      }
      return unique;
    }

    function updateStats() {
      const raw = textarea.value
        .split(/[\n,;]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
      const unique = getUniqueNames();
      stats.textContent = 'Участников: ' + raw.length + ' (уникальных: ' + unique.length + ')';
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const progressWrap = document.getElementById('progressWrap');
      const progressFill = document.getElementById('progressFill');
      const progressLabel = document.getElementById('progressLabel');

      progressWrap.classList.add('active');
      progressFill.style.width = '0%';
      progressLabel.textContent = 'Читаем файл...';

      const reader = new FileReader();
      reader.onload = function(ev) {
        const text = ev.target.result;
        const steps = [
          { p: 25, t: 'Читаем файл...' },
          { p: 55, t: 'Загружаем участников...' },
          { p: 80, t: 'Проверяем список...' },
          { p: 100, t: 'Загружено!' }
        ];
        let step = 0;

        function tick() {
          if (step < steps.length) {
            progressFill.style.width = steps[step].p + '%';
            progressLabel.textContent = steps[step].t;
            step++;
            setTimeout(tick, 260 + Math.random() * 140);
          } else {
            setTimeout(function() {
              textarea.value = text;
              updateStats();
              progressWrap.classList.remove('active');
              progressFill.style.width = '0%';
            }, 450);
          }
        }
        tick();
      };
      reader.readAsText(file, 'UTF-8');
      fileInput.value = '';
    }

    function startDraw() {
      const unique = getUniqueNames();
      const count = parseInt(countInput.value) || 5;

      if (unique.length === 0) {
        alert('Сначала вставь список участников или загрузи файл!');
        return;
      }
      if (count > unique.length) {
        alert('Уникальных участников только ' + unique.length + '. Нельзя выбрать больше.');
        return;
      }

      const shuffled = unique.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = t;
      }
      const winners = shuffled.slice(0, count);
      lastWinners = winners;

      runSlotAnimation(unique, winners);
    }

    function runSlotAnimation(allNames, winners) {
      pickBtn.disabled = true;
      slotOverlay.classList.add('active');
      slotStatus.textContent = 'Крутим...';

      const reelNames = [];
      for (let i = 0; i < 50; i++) {
        reelNames.push(allNames[Math.floor(Math.random() * allNames.length)]);
      }
      // final winners at the end
      for (let i = 0; i < winners.length; i++) {
        reelNames.push(winners[i]);
      }

      slotReel.innerHTML = reelNames.map(function(n) {
        return '<div class="slot-item">@' + n + '</div>';
      }).join('');

      const itemH = 64;
      let pos = 0;
      let speed = 42;
      let phase = 'spin'; // spin -> slow -> stop
      const stopAt = (reelNames.length - winners.length) * itemH;

      function frame() {
        if (phase === 'spin') {
          pos += speed;
          if (pos > 1800) phase = 'slow';
        } else if (phase === 'slow') {
          speed = Math.max(3, speed * 0.96);
          pos += speed;
          if (speed < 4 && pos >= stopAt - 20) {
            phase = 'stop';
            pos = stopAt;
          }
        }

        slotReel.style.transform = 'translateY(-' + pos + 'px)';

        if (phase === 'stop') {
          slotStatus.textContent = 'Готово!';
          setTimeout(function() {
            slotOverlay.classList.remove('active');
            showWinners(winners);
            pickBtn.disabled = false;
          }, 650);
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function showWinners(winners) {
      winnersList.innerHTML = '';
      winnersBox.style.display = 'block';
      copyBtn.style.display = 'block';

      winners.forEach(function(name, index) {
        const a = document.createElement('a');
        a.className = 'winner-item';
        a.href = 'https://instagram.com/' + encodeURIComponent(name);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.animationDelay = (index * 0.12) + 's';
        a.innerHTML = '<span class="place">' + (index + 1) + '.</span>@' + name +
          '<span class="hint">нажми, чтобы открыть Instagram →</span>';
        winnersList.appendChild(a);
      });

      winnersBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function copyResult() {
      if (lastWinners.length === 0) return;
      const lines = lastWinners.map(function(n, i) {
        return (i + 1) + '. @' + n;
      });
      const text = '🏆 Победители розыгрыша BOBR TESTIT:\n\n' + lines.join('\n') + '\n\nПоздравляем! 🎉';

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          const original = copyBtn.textContent;
          copyBtn.textContent = '✓ Скопировано!';
          setTimeout(function() { copyBtn.textContent = original; }, 1800);
        });
      } else {
        prompt('Скопируйте текст:', text);
      }
    }

    function clearAll() {
      textarea.value = '';
      winnersBox.style.display = 'none';
      winnersList.innerHTML = '';
      copyBtn.style.display = 'none';
      lastWinners = [];
      updateStats();
    }

    updateStats();
  </script>
</body>
</html>
